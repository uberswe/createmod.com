---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: createmod
  namespace: createmod-com-prod
  labels:
    app: createmod
    environment: prod
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: createmod
  template:
    metadata:
      labels:
        app: createmod
        environment: prod
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/skip-outbound-ports: "443,6379,9000"
        config.linkerd.io/skip-inbound-ports: "8090"
    spec:
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: createmod
          image: ghcr.io/uberswe/createmod.com:master-dd7e21c
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
              name: http
              protocol: TCP
          env:
            # Soft heap cap ~1Gi below the container memory limit (8Gi) so Go
            # GCs before the kernel OOM-kills the pod. Raised with the limit to
            # give the in-memory indexes headroom and stop the hourly OOM kills.
            - name: GOMEMLIMIT
              value: "7168MiB"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-secret
                  key: MEILI_MASTER_KEY
          envFrom:
            - configMapRef:
                name: createmod-config
            - secretRef:
                name: createmod-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /api/ready
              port: 8090
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              # CPU request unchanged so HPA (utilization = usage/request)
              # keeps scaling at the same thresholds; the higher limit just
              # lets a pod burst to 2 cores during heavy uploads instead of
              # being CFS-throttled to 1, which was starving concurrent
              # requests. automaxprocs sets GOMAXPROCS from the 2-core limit.
              cpu: 300m
              memory: 2Gi
            limits:
              # ~2 CPU / 8Gi: relieves upload-time CPU throttling and the
              # hourly OOM kills that were also churning per-pod caches.
              cpu: "2"
              memory: 8Gi
