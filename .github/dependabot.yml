# Dependabot config. Previously absent, so no automated dependency PRs were
# opened — updates and vuln fixes had to be found by hand. Weekly grouped PRs
# keep the noise low. Note: Dependabot does NOT bump the Go toolchain directive
# in go.mod or the setup-go version in CI, so Go stdlib patch bumps stay manual
# (run `govulncheck ./...` periodically).
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/template"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]
