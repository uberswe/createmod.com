<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pending moderator review">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1f24"/>
      <stop offset="1" stop-color="#151519"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="8" y="8" width="1184" height="659" rx="14" fill="none" stroke="#33343c" stroke-width="2"/>

  <!-- clock mark: "reviewed within 48 hours" -->
  <g transform="translate(600 196)" fill="none" stroke="#c69a4e" stroke-width="6" stroke-linecap="round">
    <circle r="52"/>
    <path d="M0 -30 V2 L22 16" stroke-width="7"/>
  </g>

  <text x="600" y="338" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" fill="#e2b768" letter-spacing="0.5">Pending Moderator Review</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="26" fill="#a3a3af" text-anchor="middle">
    <text x="600" y="418">This image was flagged for manual review by our automated</text>
    <text x="600" y="456">system and will be reviewed by a human within 48 hours.</text>
    <text x="600" y="494">This is normal and is sometimes simply caused by shaders</text>
    <text x="600" y="532">or a build that looks too realistic.</text>
  </g>
</svg>
