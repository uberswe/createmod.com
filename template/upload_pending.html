{{template "head.html" .}}
<div class="page">
    {{template "sidebar.html" .}}
    <div class="page-wrapper">
        {{template "header.html" .}}
        <main class="page-body">
            <div class="container-wide">

                <!-- Progress Steps -->
                {{ template "upload_steps.html" . }}

                {{ template "upload_result.html" . }}

            </div>
        </main>
        {{template "footer.html" .}}
    </div>
</div>
<style>
    /* ---- Moderation overhaul: publish result page (#1646) ---- */
    .cm-result-layout { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
    .cm-result-main { flex: 1 1 auto; max-width: 780px; min-width: 0; }
    .cm-result-rail { flex: 0 0 300px; width: 300px; }
    .cm-result-rail .card { position: sticky; top: 120px; }
    @media (max-width: 991px) {
        .cm-result-layout { flex-direction: column; align-items: stretch; }
        .cm-result-main, .cm-result-rail { max-width: none; width: auto; flex-basis: auto; }
        .cm-result-rail .card { position: static; }
    }

    /* Outcome hero */
    .cm-hero {
        display: flex; gap: 14px; align-items: flex-start;
        padding: 18px 20px; border-radius: 8px; border: 1px solid transparent;
    }
    .cm-hero__dot { flex: none; width: 12px; height: 12px; border-radius: 999px; margin-top: 6px; background: var(--cm-text-faint, #7b715c); }
    .cm-hero__title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .cm-hero__body { font-size: 14px; color: var(--cm-text-muted); margin-top: 4px; line-height: 1.55; }
    .cm-hero--ok { background: rgba(47,179,68,0.08); border-color: rgba(47,179,68,0.35); }
    .cm-hero--ok .cm-hero__dot { background: #2fb344; } .cm-hero--ok .cm-hero__title { color: #2fb344; }
    .cm-hero--warn { background: rgba(245,159,0,0.08); border-color: rgba(245,159,0,0.35); }
    .cm-hero--warn .cm-hero__dot { background: #f59f00; } .cm-hero--warn .cm-hero__title { color: #f59f00; }
    .cm-hero--bad { background: rgba(214,57,57,0.08); border-color: rgba(214,57,57,0.35); }
    .cm-hero--bad .cm-hero__dot { background: #d63939; } .cm-hero--bad .cm-hero__title { color: #e57373; }
    .cm-hero--pending { background: rgba(66,153,225,0.08); border-color: rgba(66,153,225,0.35); }
    .cm-hero--pending .cm-hero__dot { background: #4299e1; } .cm-hero--pending .cm-hero__title { color: #4299e1; }

    .cm-poll { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--cm-text-muted); }

    /* Card section title */
    .cm-card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--cm-heading-color); }

    /* Status check rows (shared with pre-publish rail semantics) */
    .cm-check { display: flex; gap: 10px; padding: 8px 0; align-items: flex-start; }
    .cm-check + .cm-check { border-top: 1px solid var(--cm-border-color); }
    .cm-check__dot { flex: none; width: 10px; height: 10px; border-radius: 999px; margin-top: 5px; background: var(--cm-text-faint, #7b715c); }
    .cm-check__name { font-size: 13.5px; font-weight: 600; color: var(--cm-body-color); }
    .cm-check__note { font-size: 12.5px; color: var(--cm-text-muted); }
    .cm-check[data-state="ok"] .cm-check__dot { background: #2fb344; }
    .cm-check[data-state="warn"] .cm-check__dot { background: #f59f00; }
    .cm-check[data-state="bad"] .cm-check__dot { background: #d63939; }
    .cm-check[data-state="neutral"] .cm-check__dot { background: #4299e1; }

    /* What you can do now */
    .cm-todo { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
    .cm-todo + .cm-todo { border-top: 1px solid var(--cm-border-color); }
    .cm-todo__text { flex: 1 1 auto; font-size: 13px; color: var(--cm-text-muted); line-height: 1.5; }
    .cm-todo__cta { flex: none; white-space: nowrap; }

    .cm-result-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--cm-border-color); font-size: 12px; color: var(--cm-text-faint); line-height: 1.5; }
</style>
<script>
function copySchematicURL() {
    var input = document.getElementById('schematic-url');
    var label = document.getElementById('copy-url-label');
    var btn = document.getElementById('copy-url-btn');
    if (!input) return;
    function flash() {
        if (label) label.textContent = 'Copied!';
        if (btn) { btn.classList.add('btn-success'); btn.classList.remove('btn-outline-secondary'); }
        setTimeout(function() {
            if (label) label.textContent = 'Copy Link';
            if (btn) { btn.classList.remove('btn-success'); btn.classList.add('btn-outline-secondary'); }
        }, 1800);
    }
    try {
        navigator.clipboard.writeText(input.value).then(flash);
    } catch (e) {
        input.select();
        document.execCommand('copy');
        flash();
    }
}
</script>
{{template "foot.html" .}}
